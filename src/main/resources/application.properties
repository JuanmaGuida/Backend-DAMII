spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_REQUEST_SIZE:55MB}

attachment.storage.root=${ATTACHMENT_STORAGE_ROOT:./data/attachments}
attachment.public-base-url=${M2_PUBLIC_BASE_URL:http://localhost:8080}
attachment.limits.max-files=${ATTACHMENT_MAX_FILES:5}
attachment.limits.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:10MB}
attachment.limits.max-total-size=${ATTACHMENT_MAX_TOTAL_SIZE:50MB}
attachment.allowed-content-types=${ATTACHMENT_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Core/Eventos v1.76: sourceModule=atencion-ciudadana y eventVersion=1.0
# son constantes contractuales del productor M2.

# Story 3.4 / DDA2-61: el simulador de updateTicketStatus esta apagado por
# defecto. Solo se prende en application-dev.properties (o el profile que
# corresponda para QA), nunca aca.
app.simulator.enabled=false
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true


ticket.information-request.response-duration=${TICKET_INFORMATION_RESPONSE_DURATION:72h}
ticket.information-request.expiration-scan-delay=${TICKET_INFORMATION_EXPIRATION_SCAN_DELAY:60000}
ticket.duplicate-search.radius-meters=${TICKET_DUPLICATE_SEARCH_RADIUS_METERS:500}
ticket.duplicate-search.time-window=${TICKET_DUPLICATE_SEARCH_TIME_WINDOW:24h}

ticket.resolution.confirmation-duration=${TICKET_RESOLUTION_CONFIRMATION_DURATION:72h}
ticket.resolution.confirmation-scan-delay=${TICKET_RESOLUTION_CONFIRMATION_SCAN_DELAY:60000}

ticket.sla.near-due-threshold=${TICKET_SLA_NEAR_DUE_THRESHOLD:0.80}
ticket.sla.milestone-scan-delay=${TICKET_SLA_MILESTONE_SCAN_DELAY:60000}

# NotificationLog conserva los pendientes hasta que el worker pueda procesarlos.
notification.pending-scan-delay=1000

# H07: normalized factors, inclusive lower bounds and millisecond job cadence.
ticket.priority.w-risk=${TICKET_PRIORITY_W_RISK:0.60}
ticket.priority.w-affected=${TICKET_PRIORITY_W_AFFECTED:0.25}
ticket.priority.w-age=${TICKET_PRIORITY_W_AGE:0.15}
ticket.priority.medium-threshold=${TICKET_PRIORITY_MEDIUM_THRESHOLD:0.15}
ticket.priority.high-threshold=${TICKET_PRIORITY_HIGH_THRESHOLD:0.30}
ticket.priority.critical-threshold=${TICKET_PRIORITY_CRITICAL_THRESHOLD:0.45}
ticket.priority.affected-bands[0].minimum-count=${TICKET_PRIORITY_BAND_0_MIN:0}
ticket.priority.affected-bands[0].score=${TICKET_PRIORITY_BAND_0_SCORE:0.00}
ticket.priority.affected-bands[1].minimum-count=${TICKET_PRIORITY_BAND_1_MIN:1}
ticket.priority.affected-bands[1].score=${TICKET_PRIORITY_BAND_1_SCORE:0.25}
ticket.priority.affected-bands[2].minimum-count=${TICKET_PRIORITY_BAND_2_MIN:50}
ticket.priority.affected-bands[2].score=${TICKET_PRIORITY_BAND_2_SCORE:0.50}
ticket.priority.affected-bands[3].minimum-count=${TICKET_PRIORITY_BAND_3_MIN:500}
ticket.priority.affected-bands[3].score=${TICKET_PRIORITY_BAND_3_SCORE:0.75}
ticket.priority.affected-bands[4].minimum-count=${TICKET_PRIORITY_BAND_4_MIN:5000}
ticket.priority.affected-bands[4].score=${TICKET_PRIORITY_BAND_4_SCORE:1.00}
ticket.priority.scan-delay=${TICKET_PRIORITY_SCAN_DELAY:300000}
ticket.priority.batch-size=${TICKET_PRIORITY_BATCH_SIZE:100}
