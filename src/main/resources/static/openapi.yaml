          description: Solicitud de información respondida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationRequestResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InformationRequestConflict'
        '410':
          description: El plazo para responder venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
