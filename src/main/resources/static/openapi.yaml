      properties:
        subcategoryId:
          type: integer
          format: int64
        code:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 200
        description:
          type: string
        ticketType:
          $ref: '#/components/schemas/TicketType'
        responsibleAreaId:
          type: string
          maxLength: 100
          description: A diferencia de RequestTypeResponse.responsibleAreaId (ModuleId), acá es un string libre validado recién al crear un ticket contra ese Request Type.
        minimumPriority:
          $ref: '#/components/schemas/Priority'
        baseRisk:
          allOf:
            - $ref: '#/components/schemas/Risk'
          description: Puede modificarse mientras el Request Type no tenga tickets asociados. Una vez utilizado por al menos un ticket, sólo se acepta conservar el mismo valor; intentar cambiarlo devuelve 400.
        affectedPopulationFactor:
          type: number
          minimum: 0
          maximum: 1
          description: Proporción 0..1 de la población del barrio que podría verse afectada (Entidades V1.49 §7.3).
        allowsAnonymous:
          type: boolean
          default: false
        requiresLocation:
          type: boolean
          default: false
      additionalProperties: false
    RequestTypeAdminResponse:
      type: object
      required: [id, subcategoryId, subcategoryName, code, name, description, ticketType, responsibleAreaId,
                 minimumPriority, baseRisk, affectedPopulationFactor, allowsAnonymous, requiresLocation, active]
      properties:
        id:
          type: integer
          format: int64
        subcategoryId:
          type: integer
          format: int64
        subcategoryName:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
        ticketType:
          $ref: '#/components/schemas/TicketType'
        responsibleAreaId:
          type: string
        minimumPriority:
          $ref: '#/components/schemas/Priority'
        baseRisk:
          $ref: '#/components/schemas/Risk'
        affectedPopulationFactor:
          type: number
        allowsAnonymous:
          type: boolean
        requiresLocation:
          type: boolean
        active:
          type: boolean
    FormTemplateAdminRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FormFieldAdminRequest'
      additionalProperties: false
    FormTemplateAdminResponse:
      type: object
      required: [id, requestTypeId, version, active, createdAt, fields]
      properties:
        id:
          type: integer
          format: int64
        requestTypeId:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormFieldAdminResponse'
    FormFieldAdminRequest:
      type: object
      description: Versión administrativa de una pregunta del formulario dinámico; ver FormFieldResponse para la proyección pública.
      required: [code, label, type, displayOrder]
      properties:
        code:
          type: string
          maxLength: 100
        label:
          type: string
          maxLength: 200
        type:
          $ref: '#/components/schemas/FormFieldType'
        required:
          type: boolean
          default: false
          description: Indica si la clave debe estar presente en `formData` al crear un ticket.
        allowUnknown:
          type: boolean
          default: false
          description: Indica si un valor JSON `null` representa una respuesta desconocida válida.
        displayOrder:
          type: integer
          format: int32
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: Forma dependiente de `type` (ej. `options` para SELECT); validado antes de persistir.
        riskRules:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/RiskRuleAdminRequest'
      additionalProperties: false
    FormFieldAdminResponse:
      type: object
      required: [id, code, label, type, required, allowUnknown, displayOrder, config, riskRules]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        label:
          type: string
        type:
          $ref: '#/components/schemas/FormFieldType'
        required:
          type: boolean
        allowUnknown:
          type: boolean
        displayOrder:
          type: integer
          format: int32
        config:
          type: object
          additionalProperties: true
        riskRules:
          type: array
          items:
            $ref: '#/components/schemas/RiskRuleAdminResponse'
    RiskRuleAdminRequest:
      type: object
      required: [operator, riskIncrement]
      properties:
        operator:
          $ref: '#/components/schemas/RiskOperator'
        expectedValue:
          nullable: true
          description: |
            Requerido para EQUALS (valor único) e IN (lista no vacía); no
            aplica a BETWEEN/GREATER_THAN/LESS_THAN, que usan valueFrom/valueTo.
        valueFrom:
          type: number
          nullable: true
          description: Requerido para BETWEEN y GREATER_THAN.
        valueTo:
          type: number
          nullable: true
          description: Requerido para BETWEEN y LESS_THAN.
        riskIncrement:
          type: integer
          format: int32
        active:
          type: boolean
          default: true
      additionalProperties: false
    RiskRuleAdminResponse:
      type: object
      required: [id, operator, expectedValue, valueFrom, valueTo, riskIncrement, active]
      properties:
        id:
          type: integer
          format: int64
        operator:
          $ref: '#/components/schemas/RiskOperator'
        expectedValue:
          nullable: true
        valueFrom:
          type: number
          nullable: true
        valueTo:
          type: number
          nullable: true
        riskIncrement:
          type: integer
          format: int32
        active:
          type: boolean
    CreateTicketRequest:
      type: object
      required: [requestTypeId, summary, description, formData]
      properties:
        requestTypeId:
          type: integer
          format: int64
        summary:
          type: string
          maxLength: 200
        description:
          type: string
        formData:
          type: object
          description: Objeto dinámico cuyas keys corresponden al `code` de los campos del formulario vigente.
          additionalProperties: true
        location:
          allOf:
            - $ref: '#/components/schemas/LocationData'
          nullable: true
      additionalProperties: false
    LocationData:
      type: object
      properties:
        addressLine:
          type: string
          maxLength: 300
          nullable: true
        street:
          type: string
          maxLength: 150
          nullable: true
        streetNumber:
          type: string
          maxLength: 30
          nullable: true
        neighborhoodId:
          type: string
          format: uuid
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        reference:
          type: string
          maxLength: 500
          nullable: true
    TicketResponse:
      type: object
      description: |
        Vista compartida de un ticket para listados y transiciones. Los GET de
        detalle usan TicketDetailResponse. No confundir con TrackingTicketResponse,
        que es la vista pública reducida. Los deadlines SLA son proyecciones
        derivadas de TicketSla y no atributos persistidos del Ticket.
      required: [id, publicId, requestTypeCode, requestTypeName, categoryName, subcategoryName,
                 ticketType, summary, currentStatus, currentPriority, responsibleAreaId,
                 assignedAgentId, anonymous, estimatedAffectedCount, escalated, neighborhoodId,
                 escalationReasonCode, escalatedAt, firstResponseDueAt, firstResponseNearDue,
                 firstResponseBreached, resolutionDueAt, slaNearDue, slaBreached, resolutionNearDueAt,
                 neighborhoodName, classificationFinalizedAt,
                 statusChangedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        publicId:
          $ref: '#/components/schemas/TicketPublicId'
        requestTypeCode:
          type: string
        requestTypeName:
          type: string
        categoryName:
          type: string
        subcategoryName:
          type: string
        ticketType:
          $ref: '#/components/schemas/TicketType'
        summary:
          type: string
        currentStatus:
          $ref: '#/components/schemas/TicketStatus'
        currentPriority:
          $ref: '#/components/schemas/Priority'
        responsibleAreaId:
          type: string
        assignedAgentId:
          type: string
          description: Id interno (ModuleUser.id) del agente asignado, si existe.
          nullable: true
        anonymous:
          type: boolean
        estimatedAffectedCount:
          type: integer
          format: int32
        escalated:
          type: boolean
        escalationReasonCode:
          allOf:
            - $ref: '#/components/schemas/EscalationReasonCode'
          nullable: true
        escalatedAt:
          type: string
          format: date-time
          nullable: true
        firstResponseDueAt:
          type: string
          format: date-time
          nullable: true
          description: Deadline del último ciclo FIRST_RESPONSE; se conserva como referencia histórica al finalizar.
        firstResponseNearDue:
          type: boolean
          description: El último ciclo FIRST_RESPONSE se encuentra actualmente en estado NEAR_DUE.
        firstResponseBreached:
          type: boolean
          description: El último ciclo FIRST_RESPONSE está en BREACHED, incluso si ya finalizó.
        resolutionDueAt:
          type: string
          format: date-time
          nullable: true
          description: Deadline del último ciclo RESOLUTION, derivado desde TicketSla.
        slaNearDue:
          type: boolean
          description: El ciclo de resolución más reciente se encuentra actualmente en estado NEAR_DUE.
        slaBreached:
          type: boolean
          description: El ciclo de resolución incumplió su SLA.
        resolutionNearDueAt:
          type: string
          format: date-time
          nullable: true
          description: Instante calculado con calendario para el umbral preventivo del ciclo de resolución actual o más reciente.
        neighborhoodId:
          type: string
          format: uuid
          nullable: true
        neighborhoodName:
          type: string
          nullable: true
        classificationFinalizedAt:
          type: string
          format: date-time
          nullable: true
        statusChangedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    TicketDetailResponse:
      type: object
      description: |
        Detalle plano del ticket. Conserva los campos útiles de TicketResponse,
        agrega descripción, metadatos de adjuntos e historial y expone sólo el
        nombre del barrio. En detalle ciudadano y citizen-view los adjuntos son
        PUBLIC y las actividades usan la proyección pública sanitizada; el detalle
        staff puede incluir adjuntos INTERNAL y campos adicionales del historial.
      required: [id, publicId, requestTypeCode, requestTypeName, categoryName, subcategoryName,
                 ticketType, summary, description, currentStatus, currentPriority, responsibleAreaId,
                 assignedAgentId, anonymous, estimatedAffectedCount, escalated, escalationReasonCode,
                 escalatedAt, firstResponseDueAt, firstResponseNearDue, firstResponseBreached,
                 resolutionDueAt, slaNearDue, slaBreached, resolutionNearDueAt, neighborhoodName,
                 classificationFinalizedAt, statusChangedAt, createdAt, updatedAt, attachments,
                 ticketActivities]
      properties:
        id:
          type: string
          format: uuid
        publicId:
          $ref: '#/components/schemas/TicketPublicId'
        requestTypeCode:
          type: string
        requestTypeName:
          type: string
        categoryName:
          type: string
        subcategoryName:
          type: string
        ticketType:
          $ref: '#/components/schemas/TicketType'
        summary:
          type: string
        description:
          type: string
        currentStatus:
          $ref: '#/components/schemas/TicketStatus'
        currentPriority:
          $ref: '#/components/schemas/Priority'
        responsibleAreaId:
          type: string
        assignedAgentId:
          type: string
          nullable: true
        anonymous:
          type: boolean
        estimatedAffectedCount:
          type: integer
          format: int32
        escalated:
          type: boolean
        escalationReasonCode:
          allOf:
            - $ref: '#/components/schemas/EscalationReasonCode'
          nullable: true
        escalatedAt:
          type: string
          format: date-time
          nullable: true
        firstResponseDueAt:
          type: string
          format: date-time
          nullable: true
        firstResponseNearDue:
          type: boolean
        firstResponseBreached:
          type: boolean
        resolutionDueAt:
          type: string
          format: date-time
          nullable: true
        slaNearDue:
          type: boolean
        slaBreached:
          type: boolean
        resolutionNearDueAt:
          type: string
          format: date-time
          nullable: true
        neighborhoodName:
          type: string
          nullable: true
        classificationFinalizedAt:
          type: string
          format: date-time
          nullable: true
        statusChangedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        attachments:
          type: array
          description: Metadatos únicamente; este contrato no provee descarga del archivo.
          items:
            $ref: '#/components/schemas/TicketAttachmentResponse'
        ticketActivities:
          type: array
          description: Historial ordenado por sequence ascendente.
          items:
            $ref: '#/components/schemas/TicketActivityResponse'
    TicketAttachmentResponse:
      type: object
      description: Metadatos seguros de un adjunto, sin claves ni internals de almacenamiento.
      required: [id, fileName, contentType, sizeBytes, visibility, createdAt]
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        visibility:
          type: string
          enum: [PUBLIC, INTERNAL]
          description: Citizen y citizen-view reciben sólo PUBLIC; staff puede recibir ambas.
        createdAt:
          type: string
          format: date-time
    TicketActivityResponse:
      type: object
      description: |
        Actividad sanitizada. actorType, prioridades y message son nulos en la
        proyección ciudadana; staff puede recibirlos. Nunca expone identificadores
        de actor/módulo/evento, metadata cruda ni ticketVersion.
      required: [sequence, actionType, previousStatus, newStatus, occurredAt, reasonCode,
                 actorType, previousPriority, newPriority, message]
      properties:
        sequence:
          type: integer
          format: int32
        actionType:
          type: string
          enum: [TICKET_CREATED, REVIEW_STARTED, STATE_CHANGED, REQUEST_TYPE_CHANGED, ROUTED,
                 RETURNED_BY_AREA, PRIORITY_CHANGED, SLA_NEAR_DUE, SLA_BREACHED, ESCALATED,
                 INFORMATION_REQUIRED, INFORMATION_PROVIDED, PROGRESS_REPORTED, DUPLICATE_LINKED,
                 RESOLVED, REOPENED, CANCELLATION_REQUESTED, CANCELLATION_APPROVED,
                 CANCELLATION_REJECTED, CANCELLED, CLOSED, PUBLIC_MESSAGE_SENT,
                 INTERNAL_MESSAGE_ADDED, ATTACHMENT_ADDED]
        previousStatus:
          allOf:
            - $ref: '#/components/schemas/TicketStatus'
          nullable: true
        newStatus:
          allOf:
            - $ref: '#/components/schemas/TicketStatus'
          nullable: true
        occurredAt:
          type: string
          format: date-time
        reasonCode:
          type: string
          nullable: true
        actorType:
          type: string
          enum: [CITIZEN, AGENT, AREA_RESPONSIBLE, ADMIN, EXTERNAL_USER, SYSTEM]
          nullable: true
        previousPriority:
          allOf:
            - $ref: '#/components/schemas/Priority'
          nullable: true
        newPriority:
          allOf:
            - $ref: '#/components/schemas/Priority'
          nullable: true
        message:
          type: string
          nullable: true
    PagedTicketResponse:
      type: object
      description: |
        Forma simplificada de la página que devuelve Spring Data (`Page<TicketResponse>`)
        para el listado de tickets; se documentan los campos estables para el
        cliente, sin los metadatos internos de paginación de Spring (`pageable`, `sort`).
      required: [content, totalElements, totalPages, size, number, first, last, numberOfElements, empty]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TicketResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
          description: Página actual (0-indexed).
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
