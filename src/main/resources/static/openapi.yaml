openapi: 3.0.3
info:
  title: M2 - Atención Ciudadana API
  description: API REST del módulo M2 de Atención Ciudadana, Reclamos y Solicitudes.
  version: 1.0.0
servers:
  - url: /
    description: Mismo origen que sirve Swagger UI
tags:
  - name: Authentication
  - name: Catalog
  - name: Tickets
  - name: Information Requests
  - name: Tracking
paths:
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Iniciar sesión en el entorno DEV
      description: Endpoint de autenticación utilizado por el proveedor de identidad mock del entorno DEV actual. No representa el mecanismo productivo definitivo.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_CREDENTIALS
                message: Usuario o contraseña inválidos
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Obtener la identidad autenticada
      operationId: getCurrentIdentity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identidad de la sesión actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
  /api/catalog/categories:
    get:
      tags: [Catalog]
      summary: Listar categorías activas
      operationId: getCategories
      responses:
        '200':
          description: Categorías activas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
  /api/catalog/neighborhoods:
    get:
      tags: [ Catalog ]
      summary: Listar barrios disponibles
      description: Devuelve el catálogo público de barrios ordenado alfabéticamente por nombre.
      operationId: getNeighborhoods
      security: [ ]
      responses:
        '200':
          description: Barrios disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NeighborhoodResponse'
  /api/catalog/neighborhoods/{neighborhoodId}:
    get:
      tags: [ Catalog ]
      summary: Obtener un barrio
      description: Devuelve un barrio del catálogo público por su identificador.
      operationId: getNeighborhood
      security: [ ]
      parameters:
        - name: neighborhoodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Barrio encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborhoodResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/catalog/categories/{categoryId}/subcategories:
    get:
      tags: [Catalog]
      summary: Listar subcategorías activas de una categoría
      operationId: getSubcategories
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Subcategorías activas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubcategoryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/catalog/subcategories/{subcategoryId}/request-types:
    get:
      tags: [Catalog]
      summary: Listar tipos de solicitud activos de una subcategoría
      operationId: getRequestTypes
      parameters:
        - $ref: '#/components/parameters/SubcategoryId'
      responses:
        '200':
          description: Tipos de solicitud activos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestTypeResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/catalog/request-types/{requestTypeId}/form:
    get:
      tags: [Catalog]
      summary: Obtener el formulario dinámico vigente
      operationId: getRequestTypeForm
      parameters:
        - $ref: '#/components/parameters/RequestTypeId'
      responses:
        '200':
          description: Definición pública del formulario dinámico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinitionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/me/tickets:
    get:
      tags: [ Tickets ]
      summary: Listar los tickets propios del usuario autenticado
      description: |
        GET /me/tickets (Entidades V1.49, sección de autenticación/roles/vistas):
        listado de los tickets del ciudadano autenticado. Cualquier rol conserva
        capacidades ciudadanas base sobre sus propios tickets, así que este
        endpoint no filtra por rol ni área — siempre scopea por el citizenId de
        quien pregunta. A diferencia de GET /tickets (la bandeja staff de la
        Story 3.1), no admite filtros de categoría/prioridad/barrio/área/estado.
      operationId: listMyTickets
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          required: false
          description: Propiedades ordenables de Ticket (whitelist propia del backend); formato `campo,direccion`.
          schema:
            type: array
            items:
              type: string
          example: [ "createdAt,desc" ]
      responses:
        '200':
          description: Página de tickets propios del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTicketResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
  /api/tickets:
    get:
      tags: [ Tickets ]
      summary: Listar tickets con filtros
      description: |
        Bandeja de tickets para agentes/administradores, con filtros combinables
        por categoría, prioridad, barrio, área responsable y estado (Story 3.1).
      operationId: listTickets
      security:
        - bearerAuth: [ ]
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: priority
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Priority'
        - name: neighborhoodId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: responsibleAreaId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          required: false
          description: Propiedades ordenables de Ticket (whitelist propia del backend); formato `campo,direccion`.
          schema:
            type: array
            items:
              type: string
          example: [ "createdAt,desc" ]
      responses:
        '200':
          description: Página de tickets que cumplen los filtros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTicketResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
    post:
      tags: [Tickets]
      summary: Crear un ticket
      description: |
        Crea un ticket autenticado. La misma operación acepta JSON puro o multipart.

        En JSON no se adjuntan archivos; si el riesgo calculado internamente es HIGH o CRITICAL,
        responde 422 EVIDENCE_REQUIRED. En multipart, `data` es un part JSON obligatorio y
        `evidence` admite hasta 5 archivos opcionales, de 10 MB cada uno y 50 MB en total.
        MIME admitidos: image/jpeg, image/png, image/webp, image/heic, image/heif y application/pdf.
      operationId: createTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/CreateTicketRequest'
                evidence:
                  type: array
                  maxItems: 5
                  description: Archivos opcionales; máximo 10 MB por archivo y 50 MB en total.
                  items:
                    type: string
                    format: binary
            encoding:
              data:
                contentType: application/json
              evidence:
                contentType: image/jpeg, image/png, image/webp, image/heic, image/heif, application/pdf
      responses:
        '201':
          description: Ticket creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTicketResponse'
        '400':
          description: Request inválido, part `data` ausente o adjunto inválido. INVALID_ATTACHMENT sólo aplica a multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missingData:
                  value:
                    code: INVALID_REQUEST
                    message: Falta el part obligatorio 'data'
                invalidAttachment:
                  value:
                    code: INVALID_ATTACHMENT
                    message: Cada evidencia debe contener un archivo no vacío.
        '401':
          $ref: '#/components/responses/InvalidToken'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Límite de adjuntos excedido; sólo aplica a multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: PAYLOAD_TOO_LARGE
                message: La evidencia supera el tamaño máximo permitido.
        '415':
          description: Content-Type del request no soportado o MIME de evidencia no admitido. El MIME de evidencia sólo aplica a multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNSUPPORTED_MEDIA_TYPE
                message: Tipo de contenido no soportado
        '422':
          description: El riesgo calculado requiere al menos una evidencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: EVIDENCE_REQUIRED
                message: El nivel de riesgo detectado requiere adjuntar al menos una evidencia.
        '503':
          description: El almacenamiento de adjuntos no está disponible; sólo aplica cuando multipart contiene evidencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: ATTACHMENT_STORAGE_UNAVAILABLE
                message: No fue posible almacenar la evidencia. Intentá nuevamente más tarde.
  /api/tickets/{ticketId}:
    get:
      tags: [ Tickets ]
      summary: Consultar el detalle de un ticket propio
      description: |
        GET /tickets/{id} (Entidades V1.49 §"Autenticación, roles y vistas"):
        detalle ciudadano de un ticket, sólo para su propietario autenticado.
        Un ticket anónimo no tiene citizenId, así que nunca es "propio" de
        nadie acá; su consulta pasa por POST /tracking/access.
      operationId: getTicketById
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Detalle del ticket propio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/staff/tickets/{ticketId}:
    get:
      tags: [ Tickets ]
      summary: Consultar el detalle staff de un ticket
      description: |
        GET /staff/tickets/{id} (Guía funcional M2 §7/§7.1): detalle de
        gestión interna. AGENT y ADMIN acceden a cualquier ticket ajeno sin
        restricción de área; AREA_RESPONSIBLE sólo a los de su propia areaId
        (o al suyo propio como ciudadano). No expone todavía
        GET /staff/tickets/{id}/citizen-view.
      operationId: getStaffTicketDetail
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Detalle staff del ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/staff/tickets/{ticketId}/citizen-view:
    get:
      tags: [ Tickets ]
      summary: Consultar un ticket ajeno con la proyección ciudadana, desde el contexto staff
      description: |
        GET /staff/tickets/{id}/citizen-view (Guía funcional M2 §7.1): misma
        proyección visible al ciudadano, pero consultada desde el contexto
        staff — no cambia la identidad de quien pregunta ni suplanta al
        propietario. Mismo control de acceso que
        GET /staff/tickets/{id}: AGENT y ADMIN acceden a cualquier ticket
        ajeno; AREA_RESPONSIBLE sólo a los de su propia areaId (o al suyo
        propio como ciudadano).
      operationId: getStaffTicketCitizenView
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Proyección ciudadana del ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tickets/{ticketId}/review:
    post:
      tags: [ Tickets ]
      summary: Tomar un ticket a revisión
      description: |
        Transición REGISTERED -> IN_REVIEW; asigna el agente autenticado como
        assignedAgent si el ticket todavía no tiene uno asignado (Story 3.2).
      operationId: startTicketReview
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket en revisión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketStateConflict'
  /api/tickets/{ticketId}/classification:
    patch:
      tags: [ Tickets ]
      summary: Corregir la clasificación de un ticket
      description: |
        Permite reclasificar el RequestType durante la primera revisión del
        ticket (antes de derivarlo a un área), recalculando área responsable,
        cantidad estimada de afectados, plantilla de formulario, prioridad y
        el SLA inicial (Story 3.2).
      operationId: correctTicketClassification
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationCorrectionRequest'
      responses:
        '200':
          description: Clasificación corregida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketStateConflict'
  /api/tickets/{ticketId}/route:
    post:
      tags: [ Tickets ]
      summary: Derivar un ticket al área responsable
      description: |
        Transición IN_REVIEW -> ROUTED; publica el evento ticketUpdated al
        outbox salvo que el área responsable sea la propia gestión interna de
        M2 (Story 3.3 / DDA2-59).
      operationId: routeTicketToArea
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket derivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketStateConflict'
  /api/tickets/{ticketId}/information-request:
    post:
      tags: [Information Requests]
      summary: Solicitar información adicional
      description: Operación permitida a AGENT o ADMIN sobre un ticket ajeno y en un estado compatible.
      operationId: requestTicketInformation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInformationRequest'
      responses:
        '201':
          description: Solicitud de información creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationRequestResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InformationRequestConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/tickets/{ticketId}/information-response:
    post:
      tags: [Information Requests]
      summary: Responder una solicitud de información
      description: Operación permitida al ciudadano propietario del ticket identificado.
      operationId: answerTicketInformation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInformationRequest'
      responses:
        '200':
          description: Solicitud de información respondida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationRequestResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InformationRequestConflict'
        '410':
          description: El plazo para responder venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INFORMATION_REQUEST_EXPIRED
                message: El plazo para responder la solicitud de información venció
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/tickets/{ticketId}/resolution:
    post:
      tags: [ Tickets ]
      summary: Registrar la resolución manual de un ticket
      description: Operación de AGENT o ADMIN para tickets ajenos gestionados por M2 en estado IN_PROGRESS.
      operationId: resolveTicketManually
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveTicketRequest'
      responses:
        '201':
          description: Resolución registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResolutionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketResolutionConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/tickets/{ticketId}/resolution/confirm:
    post:
      tags: [ Tickets ]
      summary: Confirmar la resolución de un ticket
      description: Operación permitida al propietario de un ticket en estado RESOLVED.
      operationId: confirmTicketResolution
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Resolución confirmada y ticket cerrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResolutionActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketResolutionConflict'
  /api/tickets/{ticketId}/resolution/reopen:
    post:
      tags: [ Tickets ]
      summary: Reabrir un ticket por disconformidad
      description: Operación permitida al propietario de un ticket en estado RESOLVED.
      operationId: reopenTicketResolution
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenTicketRequest'
      responses:
        '200':
          description: Ticket reabierto para retomar su tratamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResolutionActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketResolutionConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/tracking/access:
    post:
      tags: [Tracking]
      summary: Consultar un ticket por código de seguimiento
      description: El código se envía en el body para evitar exponer esta capacidad de acceso en URLs y logs de acceso.
      operationId: accessTracking
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingAccessRequest'
      responses:
        '200':
          description: Vista pública del ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingTicketResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: El código es inválido, inexistente o no corresponde a una solicitud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: TRACKING_TICKET_NOT_FOUND
                message: No se encontró una solicitud para el código de seguimiento indicado.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Bearer obtenido del proveedor de identidad vigente. En DEV puede obtenerse mediante /api/auth/login.
  parameters:
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SubcategoryId:
      name: subcategoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RequestTypeId:
      name: requestTypeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_REQUEST
            message: El request es inválido
    InvalidToken:
      description: Token Bearer ausente o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_TOKEN
            message: La sesión no es válida
    Forbidden:
      description: La identidad autenticada no tiene permiso para realizar la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: No está autorizado para realizar esta operación
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Recurso no encontrado
    InformationRequestConflict:
      description: El estado del ticket o de su solicitud pendiente impide la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INFORMATION_REQUEST_CONFLICT
            message: El estado actual del ticket no permite realizar esta operación
    TicketResolutionConflict:
      description: El área responsable o el estado actual impiden la resolución manual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: TICKET_RESOLUTION_CONFLICT
            message: El estado actual del ticket no permite su resolución manual
    TicketStateConflict:
      description: El estado actual del ticket no permite la transición solicitada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: TICKET_STATE_CONFLICT
            message: El ticket está en un estado que no permite esta operación
    UnsupportedMediaType:
      description: Tipo de contenido no soportado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNSUPPORTED_MEDIA_TYPE
            message: Tipo de contenido no soportado
  schemas:
    TicketPublicId:
      type: string
      description: Identificador humano estable del ticket; no reemplaza al UUID ni al código secreto de tracking.
      pattern: '^TK-[0-9]{4}-[0-9]{6,}$'
      example: TK-2026-000123
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false
    LoginResponse:
      type: object
      required: [token, tokenType, expiresAt, identity]
      properties:
        token:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        identity:
          $ref: '#/components/schemas/IdentityResponse'
    IdentityResponse:
      type: object
      required: [subjectId, citizenId, displayName, areaId, role]
      properties:
        subjectId:
          type: string
        citizenId:
          type: string
          format: uuid
        displayName:
          type: string
        areaId:
          allOf:
            - $ref: '#/components/schemas/ModuleId'
          nullable: true
        role:
          $ref: '#/components/schemas/ModuleRole'
    CategoryResponse:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    NeighborhoodResponse:
      type: object
      required: [ id, name, population ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        population:
          type: integer
          format: int32
    SubcategoryResponse:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
    RequestTypeResponse:
      type: object
      required: [id, code, name, description, ticketType, responsibleAreaId, allowsAnonymous, requiresLocation]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: string
        ticketType:
          $ref: '#/components/schemas/TicketType'
        responsibleAreaId:
          $ref: '#/components/schemas/ModuleId'
        allowsAnonymous:
          type: boolean
        requiresLocation:
          type: boolean
    FormDefinitionResponse:
      type: object
      required: [requestTypeId, requestTypeCode, version, fields]
      properties:
        requestTypeId:
          type: integer
          format: int64
        requestTypeCode:
          type: string
        version:
          type: integer
          format: int32
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormFieldResponse'
    FormFieldResponse:
      type: object
      description: Campo público de un formulario dinámico. Sus opciones y demás configuración viajan en `config`.
      required: [code, label, type, required, allowUnknown, displayOrder, config]
      properties:
        code:
          type: string
        label:
          type: string
        type:
          $ref: '#/components/schemas/FormFieldType'
        required:
          type: boolean
          description: Indica si la clave debe estar presente en `formData`.
        allowUnknown:
          type: boolean
          description: Indica si un valor JSON `null` representa una respuesta desconocida válida.
        displayOrder:
          type: integer
          format: int32
        config:
          type: object
          additionalProperties: true
    CreateTicketRequest:
      type: object
      required: [requestTypeId, summary, description, formData]
      properties:
        requestTypeId:
          type: integer
          format: int64
        summary:
          type: string
          maxLength: 200
        description:
          type: string
        formData:
          type: object
          description: Objeto dinámico cuyas keys corresponden al `code` de los campos del formulario vigente.
          additionalProperties: true
        location:
          allOf:
            - $ref: '#/components/schemas/LocationData'
          nullable: true
      additionalProperties: false
    LocationData:
      type: object
      properties:
        addressLine:
          type: string
          maxLength: 300
          nullable: true
        street:
          type: string
          maxLength: 150
          nullable: true
        streetNumber:
          type: string
          maxLength: 30
          nullable: true
        neighborhoodId:
          type: string
          format: uuid
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        reference:
          type: string
          maxLength: 500
          nullable: true
    TicketResponse:
      type: object
      description: |
        Vista interna de un ticket para agentes/administradores (listado y
        transiciones de Sprint 2/3). No confundir con TrackingTicketResponse,
        que es la vista pública reducida.
      required: [id, publicId, requestTypeCode, requestTypeName, categoryName, subcategoryName,
                 ticketType, summary, currentStatus, currentPriority, responsibleAreaId,
                 assignedAgentId, anonymous, estimatedAffectedCount, escalated, neighborhoodId,
                 neighborhoodName, classificationFinalizedAt, statusChangedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        publicId:
          $ref: '#/components/schemas/TicketPublicId'
        requestTypeCode:
          type: string
        requestTypeName:
          type: string
        categoryName:
          type: string
        subcategoryName:
          type: string
        ticketType:
          $ref: '#/components/schemas/TicketType'
        summary:
          type: string
        currentStatus:
          $ref: '#/components/schemas/TicketStatus'
        currentPriority:
          $ref: '#/components/schemas/Priority'
        responsibleAreaId:
          type: string
        assignedAgentId:
          type: string
          description: Id interno (ModuleUser.id) del agente asignado, si existe.
          nullable: true
        anonymous:
          type: boolean
        estimatedAffectedCount:
          type: integer
          format: int32
        escalated:
          type: boolean
        neighborhoodId:
          type: string
          format: uuid
          nullable: true
        neighborhoodName:
          type: string
          nullable: true
        classificationFinalizedAt:
          type: string
          format: date-time
          nullable: true
        statusChangedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    PagedTicketResponse:
      type: object
      description: |
        Forma simplificada de la página que devuelve Spring Data (`Page<TicketResponse>`)
        para el listado de tickets; se documentan los campos estables para el
        cliente, sin los metadatos internos de paginación de Spring (`pageable`, `sort`).
      required: [content, totalElements, totalPages, size, number, first, last, numberOfElements, empty]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TicketResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
          description: Página actual (0-indexed).
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    ClassificationCorrectionRequest:
      type: object
      required: [requestTypeId]
      properties:
        requestTypeId:
          type: integer
          format: int64
      additionalProperties: false
    CreateTicketResponse:
      type: object
      required: [ticketId, publicId, trackingCode, status]
      properties:
        ticketId:
          type: string
          format: uuid
        publicId:
          $ref: '#/components/schemas/TicketPublicId'
        trackingCode:
          type: string
          description: Código que permite consultar el ticket mediante el endpoint público de tracking.
        status:
          $ref: '#/components/schemas/TicketStatus'
    CreateInformationRequest:
      type: object
      required: [messageForCitizen]
      properties:
        messageForCitizen:
          type: string
        internalMessage:
          type: string
          nullable: true
      additionalProperties: false
    AnswerInformationRequest:
      type: object
      required: [responseMessage]
      properties:
        responseMessage:
          type: string
      additionalProperties: false
    InformationRequestResponse:
      type: object
      required: [informationRequestId, ticketId, status, messageForCitizen, requestedAt, dueAt, resumeStatus, responseMessage, answeredAt]
      properties:
        informationRequestId:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/InformationRequestStatus'
        messageForCitizen:
          type: string
        requestedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        resumeStatus:
          $ref: '#/components/schemas/TicketStatus'
        responseMessage:
          type: string
          nullable: true
        answeredAt:
          type: string
          format: date-time
          nullable: true
    ResolveTicketRequest:
      type: object
      required: [ type, publicMessage ]
      properties:
        type:
          $ref: '#/components/schemas/ResolutionType'
        publicMessage:
          type: string
          minLength: 1
        internalMessage:
          type: string
          nullable: true
      additionalProperties: false
    TicketResolutionResponse:
      type: object
      required: [ resolutionId, ticketId, status, type, publicMessage, internalMessage, resolvedAt ]
      properties:
        resolutionId:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TicketStatus'
        type:
          $ref: '#/components/schemas/ResolutionType'
        publicMessage:
          type: string
        internalMessage:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
    ReopenTicketRequest:
      type: object
      required: [ reason ]
      properties:
        reason:
          type: string
          minLength: 1
      additionalProperties: false
    TicketResolutionActionResponse:
      type: object
      required: [ ticketId, status, statusChangedAt, reopenCount ]
      properties:
        ticketId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TicketStatus'
        statusChangedAt:
          type: string
          format: date-time
        reopenCount:
          type: integer
          format: int32
    TrackingAccessRequest:
      type: object
      required: [trackingCode]
      properties:
        trackingCode:
          type: string
          description: Capacidad secreta entregada al crear la solicitud; nunca se incluye en la respuesta.
      additionalProperties: false
    TrackingTicketResponse:
      type: object
      required: [publicId, status, summary, createdAt, statusChangedAt, requestType, category, subcategory, sla]
      properties:
        publicId:
          $ref: '#/components/schemas/TicketPublicId'
        status:
          $ref: '#/components/schemas/TicketStatus'
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
        statusChangedAt:
          type: string
          format: date-time
        requestType:
          $ref: '#/components/schemas/TrackingRequestTypeSummary'
        category:
          $ref: '#/components/schemas/TrackingCategorySummary'
        subcategory:
          $ref: '#/components/schemas/TrackingSubcategorySummary'
        sla:
          $ref: '#/components/schemas/TrackingSlaSummary'
    TrackingSlaSummary:
      type: object
      required: [ firstResponseDueAt, resolutionDueAt ]
      properties:
        firstResponseDueAt:
          type: string
          format: date-time
          nullable: true
        resolutionDueAt:
          type: string
          format: date-time
          nullable: true
    TrackingRequestTypeSummary:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TrackingCategorySummary:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TrackingSubcategorySummary:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ModuleId:
      type: string
      description: Identificador técnico de módulo; los valores admitidos pertenecen al rango M1 a M9.
      enum: [M1, M2, M3, M4, M5, M6, M7, M8, M9]
    ModuleRole:
      type: string
      enum: [CITIZEN, AGENT, AREA_RESPONSIBLE, ADMIN]
    TicketType:
      type: string
      enum: [COMPLAINT, REQUEST, INQUIRY, SUGGESTION]
    TicketStatus:
      type: string
      enum: [REGISTERED, IN_REVIEW, ROUTED, IN_PROGRESS, PENDING_INFORMATION, DUPLICATE, RESOLVED, CLOSED, CANCELLED]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    InformationRequestStatus:
      type: string
      enum: [PENDING, ANSWERED, EXPIRED]
    ResolutionType:
      type: string
      enum: [ ACTION_COMPLETED, REQUEST_FULFILLED, INQUIRY_ANSWERED, ACKNOWLEDGED, NO_FURTHER_ACTION_REQUIRED ]
    FormFieldType:
      type: string
      enum: [TEXT, TEXTAREA, SELECT, BOOLEAN, NUMBER, DATE]
