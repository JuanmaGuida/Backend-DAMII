    InformationRequestStatus:
      type: string
      enum: [PENDING, ANSWERED, EXPIRED, CANCELLED]
    ResolutionType:
      type: string
      enum: [ ACTION_COMPLETED, REQUEST_FULFILLED, INQUIRY_ANSWERED, ACKNOWLEDGED, NO_FURTHER_ACTION_REQUIRED ]
    CancellationReasonCode:
      type: string
      enum: [ INFO_TIMEOUT, OUT_OF_SCOPE, DOES_NOT_APPLY, INVALID_REQUEST_TYPE, INVALID_DATA, REJECTED_BY_AREA, WITHDRAWN_BY_CITIZEN, DATA_ENTRY_ERROR, OTHER ]
    FormFieldType:
      type: string
      enum: [TEXT, TEXTAREA, SELECT, BOOLEAN, NUMBER, DATE]
    RiskOperator:
      type: string
      enum: [EQUALS, BETWEEN, GREATER_THAN, LESS_THAN, IN]
