        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenTicketRequest'
      responses:
        '200':
          description: Ticket reabierto para retomar su tratamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResolutionActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketResolutionConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/tickets/{ticketId}/cancel:
    post:
      tags: [ Tickets ]
      summary: Cancelar un ticket antes de su derivación
      description: |
        El ciudadano propietario sólo puede cancelar su propio ticket mientras
        está en REGISTERED, independientemente de su role almacenado. AGENT y
        ADMIN pueden cancelar administrativamente tickets ajenos en REGISTERED,
        IN_REVIEW o PENDING_INFORMATION. AREA_RESPONSIBLE no posee capacidad
        administrativa de cancelación. Un ticket ya derivado
        (ROUTED/IN_PROGRESS) se cancela por el flujo de integración
        (updateTicketStatus/REJECTED), no por este endpoint.
      operationId: cancelTicket
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTicketRequest'
      responses:
        '200':
          description: Ticket cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketStateConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/tracking/access:
    post:
      tags: [Tracking]
      summary: Consultar un ticket por código de seguimiento
      description: El código se envía en el body para evitar exponer esta capacidad de acceso en URLs y logs de acceso.
      operationId: accessTracking
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingAccessRequest'
      responses:
        '200':
          description: Vista pública del ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingTicketResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: El código es inválido, inexistente o no corresponde a una solicitud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: TRACKING_TICKET_NOT_FOUND
                message: No se encontró una solicitud para el código de seguimiento indicado.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Bearer obtenido del proveedor de identidad vigente. En DEV puede obtenerse mediante /api/auth/login.
  parameters:
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SubcategoryId:
      name: subcategoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RequestTypeId:
      name: requestTypeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_REQUEST
            message: El request es inválido
    InvalidToken:
      description: Token Bearer ausente o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_TOKEN
            message: La sesión no es válida
    Forbidden:
      description: La identidad autenticada no tiene permiso para realizar la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: No está autorizado para realizar esta operación
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Recurso no encontrado
    InformationRequestConflict:
      description: El estado del ticket o de su solicitud pendiente impide la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INFORMATION_REQUEST_CONFLICT
            message: El estado actual del ticket no permite realizar esta operación
    TicketResolutionConflict:
      description: El área responsable o el estado actual impiden la resolución manual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: TICKET_RESOLUTION_CONFLICT
            message: El estado actual del ticket no permite su resolución manual
    TicketStateConflict:
      description: El estado actual del ticket no permite la transición solicitada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: TICKET_STATE_CONFLICT
            message: El ticket está en un estado que no permite esta operación
    UnsupportedMediaType:
      description: Tipo de contenido no soportado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNSUPPORTED_MEDIA_TYPE
            message: Tipo de contenido no soportado
    DataIntegrityConflict:
      description: |
        La operación entra en conflicto con datos existentes (violación de
        una constraint de unicidad de base, detectada bajo una carrera real
        entre dos altas/ediciones concurrentes que el pre-check de la
        aplicación no alcanzó a frenar).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: DATA_INTEGRITY_CONFLICT
            message: La operación entra en conflicto con datos existentes
  schemas:
    TicketPublicId:
      type: string
      description: Identificador humano estable del ticket; no reemplaza al UUID ni al código secreto de tracking.
      pattern: '^TK-[0-9]{4}-[0-9]{6,}$'
      example: TK-2026-000123
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false
    LoginResponse:
      type: object
      required: [token, tokenType, expiresAt, identity]
      properties:
        token:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        identity:
          $ref: '#/components/schemas/IdentityResponse'
    IdentityResponse:
      type: object
      required: [subjectId, citizenId, displayName, areaId, role]
      properties:
        subjectId:
          type: string
        citizenId:
          type: string
          format: uuid
        displayName:
          type: string
        areaId:
          allOf:
            - $ref: '#/components/schemas/ModuleId'
          nullable: true
        role:
          $ref: '#/components/schemas/ModuleRole'
    CategoryResponse:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    NeighborhoodResponse:
      type: object
      required: [ id, name, population ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        population:
          type: integer
          format: int32
    SubcategoryResponse:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
    RequestTypeResponse:
      type: object
      required: [id, code, name, description, ticketType, responsibleAreaId, allowsAnonymous, requiresLocation]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: string
        ticketType:
          $ref: '#/components/schemas/TicketType'
        responsibleAreaId:
          $ref: '#/components/schemas/ModuleId'
        allowsAnonymous:
          type: boolean
        requiresLocation:
          type: boolean
    FormDefinitionResponse:
      type: object
      required: [requestTypeId, requestTypeCode, version, fields]
      properties:
        requestTypeId:
          type: integer
          format: int64
        requestTypeCode:
          type: string
        version:
          type: integer
          format: int32
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormFieldResponse'
    FormFieldResponse:
      type: object
      description: Campo público de un formulario dinámico. Sus opciones y demás configuración viajan en `config`.
      required: [code, label, type, required, allowUnknown, displayOrder, config]
      properties:
        code:
          type: string
        label:
          type: string
        type:
          $ref: '#/components/schemas/FormFieldType'
        required:
          type: boolean
          description: Indica si la clave debe estar presente en `formData`.
        allowUnknown:
          type: boolean
