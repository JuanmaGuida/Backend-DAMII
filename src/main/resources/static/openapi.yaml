        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketResolutionConflict'
  /api/tickets/{ticketId}/resolution/reopen:
    post:
      tags: [ Tickets ]
      summary: Reabrir un ticket por disconformidad
      description: Operación permitida al propietario de un ticket en estado RESOLVED.
      operationId: reopenTicketResolution
      security:
