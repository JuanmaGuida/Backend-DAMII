openapi: 3.0.3
info:
  title: M2 - Atención Ciudadana API
  description: API REST del módulo M2 de Atención Ciudadana, Reclamos y Solicitudes.
  version: 1.0.0
servers:
  - url: /
    description: Mismo origen que sirve Swagger UI
tags:
  - name: Authentication
  - name: Catalog
  - name: Catalog Admin
  - name: Tickets
  - name: Information Requests
  - name: Tracking
paths:
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Iniciar sesión en el entorno DEV
      description: Endpoint de autenticación utilizado por el proveedor de identidad mock del entorno DEV actual. No representa el mecanismo productivo definitivo.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_CREDENTIALS
                message: Usuario o contraseña inválidos
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Obtener la identidad autenticada
      operationId: getCurrentIdentity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identidad de la sesión actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
  /api/catalog/categories:
    get:
      tags: [Catalog]
      summary: Listar categorías activas
      operationId: getCategories
      responses:
        '200':
          description: Categorías activas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
  /api/catalog/neighborhoods:
    get:
      tags: [ Catalog ]
      summary: Listar barrios disponibles
      description: Devuelve el catálogo público de barrios ordenado alfabéticamente por nombre.
      operationId: getNeighborhoods
      security: [ ]
      responses:
        '200':
          description: Barrios disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NeighborhoodResponse'
  /api/catalog/neighborhoods/{neighborhoodId}:
    get:
      tags: [ Catalog ]
      summary: Obtener un barrio
      description: Devuelve un barrio del catálogo público por su identificador.
      operationId: getNeighborhood
      security: [ ]
      parameters:
        - name: neighborhoodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Barrio encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborhoodResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/catalog/categories/{categoryId}/subcategories:
    get:
      tags: [Catalog]
      summary: Listar subcategorías activas de una categoría
      operationId: getSubcategories
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Subcategorías activas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubcategoryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/catalog/subcategories/{subcategoryId}/request-types:
    get:
      tags: [Catalog]
      summary: Listar tipos de solicitud activos de una subcategoría
      operationId: getRequestTypes
      parameters:
        - $ref: '#/components/parameters/SubcategoryId'
      responses:
        '200':
          description: Tipos de solicitud activos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestTypeResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/catalog/request-types/{requestTypeId}/form:
    get:
      tags: [Catalog]
      summary: Obtener el formulario dinámico vigente
      operationId: getRequestTypeForm
      parameters:
        - $ref: '#/components/parameters/RequestTypeId'
      responses:
        '200':
          description: Definición pública del formulario dinámico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinitionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/catalog/categories:
    get:
      tags: [Catalog Admin]
      summary: Listar todas las categorías (activas e inactivas)
      description: |
        DDA2-114/115/116 (US "Panel de administración del catálogo"). A
        diferencia de GET /api/catalog/categories (catálogo público), lista
        TODAS las categorías sin filtrar por active, para que el panel admin
        pueda reactivarlas.
      operationId: getAdminCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todas las categorías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryAdminResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Catalog Admin]
      summary: Crear una categoría
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAdminRequest'
      responses:
        '201':
          description: Categoría creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DataIntegrityConflict'
  /api/admin/catalog/categories/{categoryId}:
    put:
      tags: [Catalog Admin]
      summary: Actualizar una categoría
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAdminRequest'
      responses:
        '200':
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DataIntegrityConflict'
  /api/admin/catalog/categories/{categoryId}/subcategories:
    get:
      tags: [Catalog Admin]
      summary: Listar todas las subcategorías de una categoría (activas e inactivas)
      operationId: getAdminSubcategoriesByCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Todas las subcategorías de la categoría.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubcategoryAdminResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/catalog/categories/{categoryId}/deactivate:
    post:
      tags: [Catalog Admin]
      summary: Desactivar una categoría
      description: |
        DDA2-120/121/122 + DDA2-126/127 (US "Activar/desactivar entidades del
        catálogo" + "Integridad jerárquica y desactivación en cascada"):
        cascadea a todas las subcategorías de la categoría y, a través de
        ellas, a todos sus tipos de solicitud.
      operationId: deactivateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Categoría desactivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/catalog/categories/{categoryId}/activate:
    post:
      tags: [Catalog Admin]
      summary: Activar una categoría
      description: |
        DDA2-120/121/122. Category es la raíz de la jerarquía, así que no
        valida ningún padre. Activar nunca cascadea hacia abajo (DDA2-128/129):
        sus subcategorías y tipos de solicitud conservan el estado que tenían.
      operationId: activateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Categoría activada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdminResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/catalog/subcategories:
    post:
      tags: [Catalog Admin]
      summary: Crear una subcategoría
      operationId: createSubcategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubcategoryAdminRequest'
      responses:
        '201':
          description: Subcategoría creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcategoryAdminResponse'
        '400':
          description: |
            Request inválido, o categoryId no corresponde a una categoría
            existente y activa, o ya existe una subcategoría con ese nombre
            en la categoría seleccionada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_REQUEST
                message: La categoría seleccionada no existe o está inactiva
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DataIntegrityConflict'
  /api/admin/catalog/subcategories/{subcategoryId}:
    put:
      tags: [Catalog Admin]
      summary: Actualizar una subcategoría
      operationId: updateSubcategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubcategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubcategoryAdminRequest'
      responses:
        '200':
          description: Subcategoría actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcategoryAdminResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DataIntegrityConflict'
  /api/admin/catalog/subcategories/{subcategoryId}/deactivate:
    post:
      tags: [Catalog Admin]
      summary: Desactivar una subcategoría
      description: DDA2-120/121/122 + DDA2-126/127. Cascadea a todos sus tipos de solicitud.
      operationId: deactivateSubcategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubcategoryId'
      responses:
        '200':
          description: Subcategoría desactivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcategoryAdminResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/catalog/subcategories/{subcategoryId}/activate:
    post:
      tags: [Catalog Admin]
      summary: Activar una subcategoría
      description: |
        DDA2-120/121/122 + DDA2-128/129: rechaza la activación si la
        categoría padre está inactiva. Nunca cascadea hacia abajo.
      operationId: activateSubcategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubcategoryId'
      responses:
        '200':
          description: Subcategoría activada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubcategoryAdminResponse'
        '400':
          description: La categoría padre de la subcategoría está inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_REQUEST
                message: No se puede activar la subcategoría porque su categoría está inactiva
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/catalog/subcategories/{subcategoryId}/request-types:
    get:
      tags: [Catalog Admin]
      summary: Listar todos los tipos de solicitud de una subcategoría (activos e inactivos)
      operationId: getAdminRequestTypesBySubcategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubcategoryId'
      responses:
        '200':
          description: Todos los tipos de solicitud de la subcategoría.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestTypeAdminResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/catalog/request-types:
    post:
      tags: [Catalog Admin]
      summary: Crear un tipo de solicitud
      operationId: createRequestType
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestTypeAdminRequest'
      responses:
        '201':
          description: Tipo de solicitud creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTypeAdminResponse'
        '400':
          description: |
            Request inválido, subcategoryId no corresponde a una subcategoría
            existente y activa (o su categoría está inactiva), o ya existe un
            tipo de solicitud con ese código o con ese nombre en la
            subcategoría seleccionada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_REQUEST
                message: Ya existe un Request Type con el código indicado
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DataIntegrityConflict'
  /api/admin/catalog/request-types/{requestTypeId}:
    put:
      tags: [Catalog Admin]
      summary: Actualizar un tipo de solicitud
      operationId: updateRequestType
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestTypeAdminRequest'
      responses:
        '200':
          description: Tipo de solicitud actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTypeAdminResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DataIntegrityConflict'
  /api/admin/catalog/request-types/{requestTypeId}/deactivate:
    post:
      tags: [Catalog Admin]
      summary: Desactivar un tipo de solicitud
      operationId: deactivateRequestType
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestTypeId'
      responses:
        '200':
          description: Tipo de solicitud desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTypeAdminResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/catalog/request-types/{requestTypeId}/activate:
    post:
      tags: [Catalog Admin]
      summary: Activar un tipo de solicitud
      description: |
        DDA2-120/121/122 + DDA2-128/129: valida la cadena completa
        (Subcategory Y Category), no sólo el padre inmediato.
      operationId: activateRequestType
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestTypeId'
      responses:
        '200':
          description: Tipo de solicitud activado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTypeAdminResponse'
        '400':
          description: La subcategoría o la categoría padre del tipo de solicitud están inactivas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_REQUEST
                message: No se puede activar el Request Type porque su subcategoría está inactiva
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/catalog/request-types/{requestTypeId}/form:
    get:
      tags: [Catalog Admin]
      summary: Obtener el formulario dinámico administrativo vigente
      description: |
        DDA2-133/134/135 (US "Administración del schema de formularios
        dinámicos"). A diferencia de GET /api/catalog/request-types/{id}/form
        (proyección pública, FormDefinitionResponse), expone el modelo
        administrativo completo (versión, reglas de riesgo, active) para
        editarlo.
      operationId: getRequestTypeFormAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestTypeId'
      responses:
        '200':
          description: Formulario dinámico administrativo vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormTemplateAdminResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El Request Type no existe, o no tiene un formulario configurado todavía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: NOT_FOUND
                message: El Request Type no tiene un formulario configurado
    put:
      tags: [Catalog Admin]
      summary: Guardar una nueva versión del formulario dinámico
      description: |
        DDA2-133/134/135. Un FormTemplate nunca se edita in-place: cada
        guardado crea una nueva versión (version+1), la marca como la única
        activa y desactiva la anterior sin borrarla (los tickets ya creados
        quedan congelados a la versión que tenían). Valida el schema antes de
        persistir — códigos de pregunta repetidos, `config` de un SELECT sin
        `options` válidas, y reglas de riesgo mal formadas o solapadas entre
        sí para la misma respuesta quedan rechazados acá con 400, en vez de
        fallar recién al crear un ticket.
      operationId: saveRequestTypeForm
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormTemplateAdminRequest'
      responses:
        '200':
          description: Nueva versión del formulario guardada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormTemplateAdminResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/me/tickets:
    get:
      tags: [ Tickets ]
      summary: Listar los tickets propios del usuario autenticado
      description: |
        GET /me/tickets (Entidades V1.49, sección de autenticación/roles/vistas):
        listado de los tickets del ciudadano autenticado. Cualquier rol conserva
        capacidades ciudadanas base sobre sus propios tickets, así que este
        endpoint no filtra por rol ni área — siempre scopea por el citizenId de
        quien pregunta. A diferencia de GET /tickets (la bandeja staff de la
        Story 3.1), no admite filtros de categoría/prioridad/barrio/área/estado.
      operationId: listMyTickets
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          required: false
          description: Propiedades ordenables de Ticket (whitelist propia del backend); formato `campo,direccion`.
          schema:
            type: array
            items:
              type: string
          example: [ "createdAt,desc" ]
      responses:
        '200':
          description: Página de tickets propios del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTicketResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
  /api/tickets:
    get:
      tags: [ Tickets ]
      summary: Listar tickets con filtros
      description: |
        Bandeja de tickets para agentes/administradores, con filtros combinables
        por categoría, prioridad, barrio, área responsable y estado (Story 3.1).
      operationId: listTickets
      security:
        - bearerAuth: [ ]
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: priority
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Priority'
        - name: neighborhoodId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: responsibleAreaId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          required: false
          description: Propiedades ordenables de Ticket (whitelist propia del backend); formato `campo,direccion`.
          schema:
            type: array
            items:
              type: string
          example: [ "createdAt,desc" ]
      responses:
        '200':
          description: Página de tickets que cumplen los filtros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTicketResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tickets]
      summary: Crear un ticket
      description: |
        Crea un ticket autenticado. La misma operación acepta JSON puro o multipart.

        En JSON no se adjuntan archivos; si el riesgo calculado internamente es HIGH o CRITICAL,
        responde 422 EVIDENCE_REQUIRED. En multipart, `data` es un part JSON obligatorio y
        `evidence` admite hasta 5 archivos opcionales, de 10 MB cada uno y 50 MB en total.
        MIME admitidos: image/jpeg, image/png, image/webp, image/heic, image/heif y application/pdf.
      operationId: createTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/CreateTicketRequest'
                evidence:
                  type: array
                  maxItems: 5
                  description: Archivos opcionales; máximo 10 MB por archivo y 50 MB en total.
                  items:
                    type: string
                    format: binary
            encoding:
              data:
                contentType: application/json
              evidence:
                contentType: image/jpeg, image/png, image/webp, image/heic, image/heif, application/pdf
      responses:
        '201':
          description: Ticket creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTicketResponse'
        '400':
          description: Request inválido, part `data` ausente o adjunto inválido. INVALID_ATTACHMENT sólo aplica a multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missingData:
                  value:
                    code: INVALID_REQUEST
                    message: Falta el part obligatorio 'data'
                invalidAttachment:
                  value:
                    code: INVALID_ATTACHMENT
                    message: Cada evidencia debe contener un archivo no vacío.
        '401':
          $ref: '#/components/responses/InvalidToken'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Límite de adjuntos excedido; sólo aplica a multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: PAYLOAD_TOO_LARGE
                message: La evidencia supera el tamaño máximo permitido.
        '415':
          description: Content-Type del request no soportado o MIME de evidencia no admitido. El MIME de evidencia sólo aplica a multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNSUPPORTED_MEDIA_TYPE
                message: Tipo de contenido no soportado
        '422':
          description: El riesgo calculado requiere al menos una evidencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: EVIDENCE_REQUIRED
                message: El nivel de riesgo detectado requiere adjuntar al menos una evidencia.
        '503':
          description: El almacenamiento de adjuntos no está disponible; sólo aplica cuando multipart contiene evidencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: ATTACHMENT_STORAGE_UNAVAILABLE
                message: No fue posible almacenar la evidencia. Intentá nuevamente más tarde.
  /api/tickets/{ticketId}:
    get:
      tags: [ Tickets ]
      summary: Consultar el detalle de un ticket propio
      description: |
        GET /tickets/{id} (Entidades V1.49 §"Autenticación, roles y vistas"):
        detalle ciudadano de un ticket, sólo para su propietario autenticado.
        Un ticket anónimo no tiene citizenId, así que nunca es "propio" de
        nadie acá; su consulta pasa por POST /tracking/access.
      operationId: getTicketById
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Detalle del ticket propio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/staff/tickets/{ticketId}:
    get:
      tags: [ Tickets ]
      summary: Consultar el detalle staff de un ticket
      description: |
        GET /staff/tickets/{id} (Guía funcional M2 §7/§7.1): detalle de
        gestión interna. AGENT y ADMIN acceden a cualquier ticket ajeno sin
        restricción de área; AREA_RESPONSIBLE sólo a los de su propia areaId
        (o al suyo propio como ciudadano). El endpoint citizen-view expone
        en cambio la misma proyección pública que recibe el propietario.
      operationId: getStaffTicketDetail
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Detalle staff del ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/staff/tickets/{ticketId}/citizen-view:
    get:
      tags: [ Tickets ]
      summary: Consultar un ticket ajeno con la proyección ciudadana, desde el contexto staff
      description: |
        GET /staff/tickets/{id}/citizen-view (Guía funcional M2 §7.1): misma
        proyección visible al ciudadano, pero consultada desde el contexto
        staff — no cambia la identidad de quien pregunta ni suplanta al
        propietario. Mismo control de acceso que
        GET /staff/tickets/{id}: AGENT y ADMIN acceden a cualquier ticket
        ajeno; AREA_RESPONSIBLE sólo a los de su propia areaId (o al suyo
        propio como ciudadano).
      operationId: getStaffTicketCitizenView
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Proyección ciudadana del ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tickets/{ticketId}/review:
    post:
      tags: [ Tickets ]
      summary: Tomar un ticket a revisión
      description: |
        Transición REGISTERED -> IN_REVIEW; asigna el agente autenticado como
        assignedAgent si el ticket todavía no tiene uno asignado. Requiere rol
        AGENT o ADMIN y no permite usar capacidad administrativa sobre un ticket
        propio (Story 3.2).
      operationId: startTicketReview
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket en revisión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketStateConflict'
  /api/tickets/{ticketId}/classification:
    patch:
      tags: [ Tickets ]
      summary: Corregir la clasificación de un ticket
      description: |
        Permite reclasificar el RequestType durante la primera revisión del
        ticket (antes de derivarlo a un área), recalculando área responsable,
        cantidad estimada de afectados, plantilla de formulario, prioridad y
        el SLA inicial (Story 3.2). Requiere rol AGENT o ADMIN y no permite
        usar capacidad administrativa sobre un ticket propio.
      operationId: correctTicketClassification
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationCorrectionRequest'
      responses:
        '200':
          description: Clasificación corregida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketStateConflict'
  /api/tickets/{ticketId}/route:
    post:
      tags: [ Tickets ]
      summary: Finalizar clasificación y comenzar o derivar la gestión
      description: |
        Requiere rol AGENT o ADMIN y no permite usar capacidad administrativa
        sobre un ticket propio. Si responsibleAreaId=M2, realiza la transición
        IN_REVIEW -> IN_PROGRESS e inicia la gestión propia sin evento ROUTED.
        Si el área es externa, realiza IN_REVIEW -> ROUTED y publica el snapshot
        ticketUpdated/ROUTED (Story 3.3 / DDA2-59).
      operationId: routeTicketToArea
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Clasificación finalizada y gestión iniciada o derivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketStateConflict'
  /api/tickets/{ticketId}/information-request:
