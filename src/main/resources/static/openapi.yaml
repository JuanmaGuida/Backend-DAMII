      enum: [M1, M2, M3, M4, M5, M6, M7, M8, M9]
    ModuleRole:
      type: string
      enum: [CITIZEN, AGENT, AREA_RESPONSIBLE, ADMIN]
    TicketType:
      type: string
      enum: [COMPLAINT, REQUEST, INQUIRY, SUGGESTION]
    TicketStatus:
      type: string
      enum: [REGISTERED, IN_REVIEW, ROUTED, IN_PROGRESS, PENDING_INFORMATION, DUPLICATE, RESOLVED, CLOSED, CANCELLED]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    Risk:
      type: string
      description: Riesgo base de un Request Type (RequestType.baseRisk); mismos valores que Priority pero un concepto distinto — el riesgo dinámico de un ticket parte de éste y se incrementa por RiskRule.
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    EscalationReasonCode:
      type: string
