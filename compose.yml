services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reclamos}
      POSTGRES_USER: ${POSTGRES_USER:-reclamos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reclamos_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reclamos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reclamos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reclamos_local}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: