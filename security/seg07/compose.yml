# Standalone file: never combine with the application's regular Compose.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seg07
      POSTGRES_USER: seg07
      POSTGRES_PASSWORD: ${SEG07_DB_PASSWORD:?generated by run.sh}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U seg07 -d seg07']
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [data]
  application:
    image: seg07-backend:local
    build:
      context: ../..
      dockerfile: security/seg07/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      IDENTITY_PROVIDER: MOCK
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/seg07
      SPRING_DATASOURCE_USERNAME: seg07
      SPRING_DATASOURCE_PASSWORD: ${SEG07_DB_PASSWORD:?}
      TRACKING_CODE_ENCRYPTION_KEY_BASE64: ${SEG07_KEY:?}
      TRACKING_CODE_ENCRYPTION_KEY_ID: seg07-disposable
      MOCK_CITIZEN_PASSWORD: ${SEG07_CITIZEN_PASSWORD:?}
      MOCK_AGENT_PASSWORD: ${SEG07_AGENT_PASSWORD:?}
      MOCK_AREA_RESPONSIBLE_PASSWORD: ${SEG07_AREA_RESPONSIBLE_PASSWORD:?}
      MOCK_ADMIN_PASSWORD: ${SEG07_ADMIN_PASSWORD:?}
      CORE_OUTBOX_ENABLED: 'false'
      CORE_INBOX_ENABLED: 'false'
      AI_ENABLED: 'false'
      SIMULATOR_ENABLED: 'false'
      SPRING_JPA_SHOW_SQL: 'false'
      ATTACHMENT_STORAGE_ROOT: /tmp/attachments
      JAVA_TOOL_OPTIONS: -Xmx768m
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    # No published ports, host mounts, shared volumes or external connectivity.
  backend:
    image: python:3.12.10-slim-bookworm
    entrypoint: [python3, /seg07/guard.py]
    environment:
      SEG07_MODE: ${SEG07_MODE:?}
      SEG07_SETUP_KEY: ${SEG07_SETUP_KEY:?}
    volumes:
      - .:/seg07:ro
    depends_on: [application]
    networks: [isolated, data]
  scanner:
    image: ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
    user: '0:0'
    entrypoint: [python3, /seg07/scan.py]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx768m
      SEG07_MODE: ${SEG07_MODE:?baseline or active}
      SEG07_SETUP_KEY: ${SEG07_SETUP_KEY:?}
      SEG07_CITIZEN_PASSWORD: ${SEG07_CITIZEN_PASSWORD:?}
      SEG07_AGENT_PASSWORD: ${SEG07_AGENT_PASSWORD:?}
      SEG07_AREA_RESPONSIBLE_PASSWORD: ${SEG07_AREA_RESPONSIBLE_PASSWORD:?}
      SEG07_ADMIN_PASSWORD: ${SEG07_ADMIN_PASSWORD:?}
    volumes:
      - .:/seg07:ro
      - ${SEG07_REPORT_DIR:?}:/reports
    depends_on: [backend]
    networks: [isolated]
networks:
  isolated:
    internal: true
  data:
    internal: true
