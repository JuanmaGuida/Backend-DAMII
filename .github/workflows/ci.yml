name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, coverage and package
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: m2_ci
          POSTGRES_USER: m2_ci
          POSTGRES_PASSWORD: m2_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U m2_ci -d m2_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/m2_ci
      SPRING_DATASOURCE_USERNAME: m2_ci
      SPRING_DATASOURCE_PASSWORD: m2_ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Test, generate coverage and package
        run: ./mvnw -B clean verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error
