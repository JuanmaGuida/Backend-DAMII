name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    name: Resolve provider and validate CD contracts
    runs-on: ubuntu-latest
    outputs:
      identity_provider: ${{ steps.mode.outputs.identity_provider }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test CD contracts without remote access
        run: python3 -m unittest discover -s .github/tests -v
      - name: Resolve identity provider
        id: mode
        env:
          CD_IDENTITY_PROVIDER: ${{ vars.CD_IDENTITY_PROVIDER }}
        run: bash .github/scripts/resolve-provider.sh

  validate:
    name: Test, coverage and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: configuration
    concurrency:
      group: ${{ github.workflow }}-validate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: m2_ci
          POSTGRES_USER: m2_ci
          POSTGRES_PASSWORD: m2_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U m2_ci -d m2_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/m2_ci
      SPRING_DATASOURCE_USERNAME: m2_ci
      SPRING_DATASOURCE_PASSWORD: m2_ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Test, generate coverage and package
        env:
          # Synthetic fixture only; no runtime secret is needed by CI or image builds.
          TRACKING_CODE_ENCRYPTION_KEY_BASE64: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          TRACKING_CODE_ENCRYPTION_KEY_ID: ci-v1
          MOCK_CITIZEN_PASSWORD: ci-citizen-password
          MOCK_AGENT_PASSWORD: ci-agent-password
          MOCK_AREA_RESPONSIBLE_PASSWORD: ci-area-password
          MOCK_ADMIN_PASSWORD: ci-admin-password
          SIMULATOR_ENABLED: "false"
          IDENTITY_PROVIDER: MOCK
          CORE_OUTBOX_ENABLED: "false"
          CORE_INBOX_ENABLED: "false"
          CORE_OUTBOX_AUTO_APPROVE_NEW_EVENTS: "false"
          CORE_OUTBOX_APPROVED_EVENT_IDS: ""
        run: ./mvnw -B clean verify

      - name: Publish line coverage summary
        shell: bash
        run: |
          awk -F, '
            NR > 1 { missed += $8; covered += $9 }
            END {
              total = missed + covered
              percentage = total == 0 ? 0 : (covered * 100 / total)
              print "### Backend coverage"
              print ""
              printf "- Line coverage: **%.2f%%** (%d/%d lines)\n", percentage, covered, total
              print "- Required LINE coverage gate: **85%**"
            }
          ' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Build Backend container image
        if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
        run: docker build --tag backend-ci:${{ github.sha }} .

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error

  publish:
    name: Publish Backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backend-dev-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/juanmaguida/backend-damii:dev
            ghcr.io/juanmaguida/backend-damii:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy Backend to Lightsail
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.CD_ENABLED == 'true'
    needs: [configuration, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lightsail-dev-backend-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout deployment guards
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Refuse stale dev runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')"
          [[ "$current_sha" == "$GITHUB_SHA" ]] || { echo 'Stale dev run; no deployment allowed.' >&2; exit 65; }

      - name: Validate selected CD provider
        env:
          SELECTED_PROVIDER: ${{ needs.configuration.outputs.identity_provider }}
          CONFIGURED_CD_PROVIDER: ${{ vars.CD_IDENTITY_PROVIDER }}
        shell: bash
        run: |
          [[ "$SELECTED_PROVIDER" == M1 || "$SELECTED_PROVIDER" == MOCK ]]
          [[ "$SELECTED_PROVIDER" == "$CONFIGURED_CD_PROVIDER" ]] || { echo 'Selected provider differs from configured CD provider.' >&2; exit 65; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure SSH
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        shell: bash
        run: |
          : "${LIGHTSAIL_SSH_PRIVATE_KEY:?LIGHTSAIL_SSH_PRIVATE_KEY is required}"
          : "${LIGHTSAIL_KNOWN_HOSTS:?LIGHTSAIL_KNOWN_HOSTS is required}"
          umask 077
          printf '%s\n' "$LIGHTSAIL_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lightsail_cd"
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$RUNNER_TEMP/lightsail_known_hosts"
          chmod 600 "$RUNNER_TEMP/lightsail_cd" "$RUNNER_TEMP/lightsail_known_hosts"

      - name: Deploy published Backend SHA
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER }}
          LIGHTSAIL_DEPLOY_PATH: ${{ vars.LIGHTSAIL_DEPLOY_PATH }}
          CD_PROVIDER: ${{ needs.configuration.outputs.identity_provider }}
        shell: bash
        run: |
          : "${LIGHTSAIL_HOST:?LIGHTSAIL_HOST is required}"
          : "${LIGHTSAIL_USER:?LIGHTSAIL_USER is required}"
          : "${LIGHTSAIL_DEPLOY_PATH:?LIGHTSAIL_DEPLOY_PATH is required}"
          [[ "$LIGHTSAIL_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$LIGHTSAIL_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$LIGHTSAIL_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          ssh \
            -i "$RUNNER_TEMP/lightsail_cd" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/lightsail_known_hosts" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "bash -s -- '$LIGHTSAIL_DEPLOY_PATH' backend '$GITHUB_SHA' '$CD_PROVIDER'" \
            < .github/scripts/deploy-cd.sh

      - name: Remove temporary SSH files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lightsail_cd" "$RUNNER_TEMP/lightsail_known_hosts"
